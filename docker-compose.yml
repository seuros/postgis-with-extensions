# `docker compose up -d` runs the published image (IMAGE_TAG / IMAGE_FLAVOR pick
# the variant). `make test` and CI point IMAGE_NAME/IMAGE_TAG at a local build
# and run the `sut` service, which reuses the image under test as psql client.
x-image: &image ${IMAGE_NAME:-ghcr.io/seuros/postgis-with-extensions}:${IMAGE_TAG:-18}${IMAGE_FLAVOR:-}

services:
  postgres:
    image: *image
    environment:
      POSTGRES_USER: ibn_trippin
      POSTGRES_PASSWORD: camelvisions420
      POSTGRES_DB: sufi_geo_delirium
      TZ: UTC
    ports:
      - "5432" # random host port; container remains on 5432
    healthcheck:
      # TCP on purpose: the entrypoint's init-time server only listens on the
      # unix socket, so this turns healthy only once the real server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ibn_trippin", "-d", "sufi_geo_delirium"]
      interval: 2s
      timeout: 5s
      retries: 60

  sut:
    # System-Under-Test: only started via `docker compose run sut`
    image: *image
    profiles: [test]
    entrypoint: ["psql"]
    # for client tools the suite shells out to (pg_repack)
    environment:
      PGHOST: postgres
      PGUSER: ibn_trippin
      PGPASSWORD: camelvisions420
    command:
      - "postgresql://ibn_trippin:camelvisions420@postgres:5432/sufi_geo_delirium"
      - "-X"
      - "-a"
      - "-f"
      - "/tests/create_extensions.sql"
    volumes:
      - ./tests:/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
